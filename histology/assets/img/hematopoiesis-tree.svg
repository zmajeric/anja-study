<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Gill Sans, Segoe UI, system-ui, sans-serif" font-size="11">
  <title>Hematopoiesis lineage tree, as drawn in the study script (Chapter 1)</title>
  <defs>
    <style>
      .b { fill: #fff; stroke: #d9d4c7; stroke-width: 1.2; rx: 4; }
      .b.root { stroke: #1b1b1b; stroke-width: 1.6; }
      .b.my { stroke: #8a1c1c; }
      .b.ly { stroke: #1c3f8a; }
      .b.end { fill: #faf8f2; }
      text { fill: #1b1b1b; text-anchor: middle; }
      .lbl { font-size: 9.5px; fill: #5c5c5c; }
      line { stroke: #9a9484; stroke-width: 1.2; }
      line.my { stroke: #8a1c1c; }
      line.ly { stroke: #1c3f8a; }
    </style>
  </defs>

  <!-- root -->
  <rect class="b root" x="284" y="14" width="152" height="34"/>
  <text x="360" y="28">Multipotential hematopoietic</text>
  <text x="360" y="41">stem cell · hemocytoblast</text>
  <text class="lbl" x="360" y="8">self-renewing</text>

  <!-- root → progenitors -->
  <line class="my" x1="330" y1="48" x2="225" y2="96"/>
  <line class="ly" x1="390" y1="48" x2="585" y2="96"/>

  <rect class="b my" x="169" y="96" width="112" height="32"/>
  <text x="225" y="110">Common myeloid</text>
  <text x="225" y="122">progenitor</text>

  <rect class="b ly" x="529" y="96" width="112" height="32"/>
  <text x="585" y="110">Common lymphoid</text>
  <text x="585" y="122">progenitor</text>

  <!-- myeloid → row 3 -->
  <line class="my" x1="225" y1="128" x2="45" y2="188"/>
  <line class="my" x1="225" y1="128" x2="135" y2="188"/>
  <line class="my" x1="225" y1="128" x2="225" y2="188"/>
  <line class="my" x1="225" y1="128" x2="315" y2="188"/>

  <rect class="b my" x="1" y="188" width="88" height="30"/>
  <text x="45" y="207">Megakaryocyte</text>
  <rect class="b my end" x="91" y="188" width="88" height="30"/>
  <text x="135" y="207">Erythrocyte</text>
  <rect class="b my end" x="181" y="188" width="88" height="30"/>
  <text x="225" y="207">Mast cell</text>
  <rect class="b my" x="271" y="188" width="88" height="30"/>
  <text x="315" y="207">Myeloblast</text>

  <!-- megakaryocyte → thrombocytes -->
  <line class="my" x1="45" y1="218" x2="45" y2="278"/>
  <rect class="b my end" x="1" y="278" width="88" height="30"/>
  <text x="45" y="297">Thrombocytes</text>
  <text class="lbl" x="45" y="323">(shed from surface)</text>

  <!-- myeloblast → four -->
  <line class="my" x1="315" y1="218" x2="225" y2="278"/>
  <line class="my" x1="315" y1="218" x2="315" y2="278"/>
  <line class="my" x1="315" y1="218" x2="405" y2="278"/>
  <line class="my" x1="315" y1="218" x2="495" y2="278"/>

  <rect class="b my end" x="181" y="278" width="88" height="30"/>
  <text x="225" y="297">Basophil</text>
  <rect class="b my end" x="271" y="278" width="88" height="30"/>
  <text x="315" y="297">Neutrophil</text>
  <rect class="b my end" x="361" y="278" width="88" height="30"/>
  <text x="405" y="297">Eosinophil</text>
  <rect class="b my" x="451" y="278" width="88" height="30"/>
  <text x="495" y="297">Monocyte</text>

  <line class="my" x1="495" y1="308" x2="495" y2="368"/>
  <rect class="b my end" x="451" y="368" width="88" height="30"/>
  <text x="495" y="387">Macrophage</text>

  <!-- lymphoid → row 3 -->
  <line class="ly" x1="585" y1="128" x2="540" y2="188"/>
  <line class="ly" x1="585" y1="128" x2="640" y2="188"/>

  <rect class="b ly end" x="488" y="188" width="104" height="30"/>
  <text x="540" y="202">Natural killer cell</text>
  <text x="540" y="213" class="lbl">(large granular)</text>
  <rect class="b ly" x="596" y="188" width="88" height="30"/>
  <text x="640" y="207">Small lymphocyte</text>

  <line class="ly" x1="640" y1="218" x2="585" y2="278"/>
  <line class="ly" x1="640" y1="218" x2="675" y2="278"/>

  <rect class="b ly end" x="541" y="278" width="88" height="30"/>
  <text x="585" y="297">T lymphocyte</text>
  <rect class="b ly" x="631" y="278" width="88" height="30"/>
  <text x="675" y="297">B lymphocyte</text>

  <line class="ly" x1="675" y1="308" x2="675" y2="368"/>
  <rect class="b ly end" x="631" y="368" width="88" height="30"/>
  <text x="675" y="387">Plasma cell</text>

  <!-- legend -->
  <line class="my" x1="20" y1="405" x2="44" y2="405"/><text x="50" y="409" class="lbl" style="text-anchor:start">myeloid line</text>
  <line class="ly" x1="150" y1="405" x2="174" y2="405"/><text x="180" y="409" class="lbl" style="text-anchor:start">lymphoid line</text>
  <text x="330" y="409" class="lbl" style="text-anchor:start">shaded = end cell as the script draws it</text>
</svg>
